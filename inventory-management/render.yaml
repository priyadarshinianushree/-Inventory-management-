services:
  - type: web
    name: inventory-management
    runtime: python
    plan: free
    rootDir: inventory-management
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
