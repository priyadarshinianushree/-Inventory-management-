<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockPilot - Inventory Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233454d1'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div id="login-view" class="login-wrap" hidden>
    <div class="login-side">
      <a class="brand" href="/"><span class="logo">SP</span><div><strong>StockPilot</strong><small>Inventory Management</small></div></a>
      <h2>Know what you have,<br>and where it is.</h2>
      <p>Products, stock, warehouses and transactions in one place.</p>
      <img src="images/hero-warehouse.svg" alt="" aria-hidden="true">
    </div>
    <div class="login-main">
      <div class="login-card">
        <h2>Welcome back</h2>
        <p class="login-sub">Sign in to continue to StockPilot</p>
        <form id="login-form" novalidate>
          <div class="field" data-field="username"><label for="l_username">Username</label>
            <input id="l_username" name="username" autocomplete="username" required autofocus><div class="err"></div></div>
          <div class="field" data-field="password"><label for="l_password">Password</label>
            <input id="l_password" name="password" type="password" autocomplete="current-password" required><div class="err"></div></div>
          <div class="form-error" hidden></div>
          <button class="btn primary block" type="submit">Sign in</button>
        </form>
        <a class="back-link" href="/">&larr; Back to home</a>
      </div>
    </div>
  </div>

  <!-- ===================== APP SHELL ===================== -->
  <div id="app-view" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="logo">SP</span><div><strong>StockPilot</strong><small>Inventory Management</small></div></div>
      <nav id="nav"></nav>
      <div class="user-box">
        <div class="avatar" id="user-avatar"></div>
        <div class="who"><strong id="user-name"></strong><small id="user-role"></small></div>
        <button class="icon-btn light" id="btn-password" title="Change password" aria-label="Change password">&#128273;</button>
        <button class="icon-btn light" id="btn-logout" title="Sign out" aria-label="Sign out"></button>
      </div>
    </aside>
    <div class="backdrop" id="nav-backdrop"></div>
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="btn-menu" aria-label="Menu">&#9776;</button>
        <h1 id="page-title">Dashboard</h1>
      </header>
      <section id="page" class="page"></section>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/crud.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
